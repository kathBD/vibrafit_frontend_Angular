<footer class="vf-footer">
  <div class="vf-footer-container">

    <!-- Brand -->
    <div class="vf-footer-brand">
      <img src="assets/images/logo.jpg" alt="VibraFit"
           class="vf-footer-logo" onerror="this.style.display='none'">
      <span>VibraFit</span>
    </div>

    <!-- Copy -->
    <p class="vf-footer-copy">
      &copy; {{ year }} VibraFit. Todos los derechos reservados.
    </p>

    <!-- Links + Redes -->
    <div class="vf-footer-right">
      <div class="vf-footer-links">
        <a routerLink="/about">Acerca de</a>
        <a routerLink="/contact">Contacto</a>
        <a routerLink="/privacy">Privacidad</a>
      </div>
      <div class="vf-footer-social">
        <a href="https://instagram.com" target="_blank" aria-label="Instagram">
          <i class="bi bi-instagram"></i>
        </a>
        <a href="https://facebook.com" target="_blank" aria-label="Facebook">
          <i class="bi bi-facebook"></i>
        </a>
        <a href="https://twitter.com" target="_blank" aria-label="Twitter">
          <i class="bi bi-twitter-x"></i>
        </a>
        <a href="https://youtube.com" target="_blank" aria-label="YouTube">
          <i class="bi bi-youtube"></i>
        </a>
      </div>
    </div>

  </div>
</footer>
